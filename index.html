<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#2b1055">
<title>İSMET TERBİYELİ Mİ?</title>
<style>
  :root {
    --ink: #1d1233;
    --card: #fffaf0;
    --yellow: #ffd93d;
    --pink: #ff4d8d;
    --green: #2ed47a;
    --red: #ff3b4e;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html, body {
    width: 100%;
    overflow-x: hidden;
  }

  body {
    min-height: 100vh;
    min-height: 100dvh;
    font-family: "Trebuchet MS", "Segoe UI", system-ui, -apple-system, sans-serif;
    color: var(--ink);
    background: linear-gradient(135deg, #2b1055, #7b2ff7, #ff4d8d, #ff9f43);
    background-size: 300% 300%;
    animation: bgMove 14s ease infinite;
    display: flex;
    padding: 16px;
    padding-bottom: calc(16px + env(safe-area-inset-bottom));
  }

  body.final-mode {
    background-image: linear-gradient(135deg, #14002e, #b5006a, #ff6a00, #4b0082);
    animation-duration: 6s;
  }

  @keyframes bgMove {
    0%, 100% { background-position: 0% 50%; }
    50%      { background-position: 100% 50%; }
  }

  /* ---------- Uçuşan emojiler ve konfeti ---------- */
  .fx {
    position: fixed;
    inset: 0;
    overflow: hidden;
    pointer-events: none;
  }
  #floaters { z-index: 0; }
  #confetti { z-index: 5; }

  .floater {
    position: absolute;
    bottom: -60px;
    opacity: .35;
    animation: floatUp linear infinite;
  }
  @keyframes floatUp {
    to { transform: translateY(-120vh) rotate(360deg); }
  }

  .confetti-piece {
    position: absolute;
    top: -50px;
    animation: fall linear forwards;
  }
  @keyframes fall {
    to { transform: translate(var(--drift), 120vh) rotate(var(--spin)); }
  }

  /* ---------- Ekranlar ve kart ---------- */
  .screen {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 520px;
    margin: auto;
    text-align: center;
  }
  .screen[hidden] { display: none; }

  .card {
    background: var(--card);
    border: 4px solid var(--ink);
    border-radius: 28px;
    box-shadow: 8px 10px 0 rgba(29, 18, 51, .55);
    padding: 18px;
    animation: cardIn .6s cubic-bezier(.2, 1.4, .4, 1) both;
  }
  @keyframes cardIn {
    from { opacity: 0; transform: translateY(30px) scale(.94); }
    to   { opacity: 1; transform: none; }
  }

  /* ---------- Fotoğraflar (oran bozulmaz) ---------- */
  .photo {
    position: relative;
    width: 100%;
    height: clamp(170px, 36vh, 380px);
    border: 4px solid var(--ink);
    border-radius: 20px;
    overflow: hidden;
    background: repeating-conic-gradient(#2b1055 0 15deg, #3d1a73 15deg 30deg);
  }
  .photo img {
    display: block;
    width: 100%;
    height: 100%;
    object-fit: contain;
  }
  .photo .fallback {
    display: none;
    position: absolute;
    inset: 0;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    color: #fff;
    font-weight: 700;
    padding: 12px;
  }
  .photo .fallback span { font-size: 4rem; }
  .photo.broken img { display: none; }
  .photo.broken .fallback { display: flex; }

  /* ---------- Soru ve uyarı ---------- */
  .text-area {
    min-height: 112px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    gap: 6px;
    padding: 10px 0;
  }
  #question {
    font-size: clamp(1.35rem, 6vw, 2rem);
    line-height: 1.2;
    font-weight: 900;
    text-wrap: balance;
  }
  .swap { animation: swap .45s cubic-bezier(.2, 1.5, .4, 1); }
  @keyframes swap {
    from { opacity: 0; transform: translateY(14px) scale(.85); }
    to   { opacity: 1; transform: none; }
  }

  .shake { animation: shake .45s ease; }
  @keyframes shake {
    0%, 100% { translate: 0 0; }
    20% { translate: -9px 0; }
    40% { translate: 8px 0; }
    60% { translate: -6px 0; }
    80% { translate: 4px 0; }
  }

  /* ---------- Butonlar ---------- */
  /* Her butonun sabit yüksekliğinde bir yuvası var. Böylece butonlar büyüyüp
     küçülürken yer değiştirmez ve hızlı tıklamada yanlış butona basılmaz. */
  .slot {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    width: 100%;
  }
  .slot-yes { height: 74px; }
  .slot-no  { height: 124px; }

  .btn {
    font: inherit;
    font-weight: 900;
    color: #fff;
    border: 4px solid var(--ink);
    border-radius: 999px;
    cursor: pointer;
    max-width: 100%;
    box-shadow: 0 6px 0 var(--ink);
    text-shadow: 0 2px 0 rgba(0, 0, 0, .3);
    touch-action: manipulation;
    user-select: none;
    -webkit-user-select: none;
    -webkit-tap-highlight-color: transparent;
    transition:
      width .45s cubic-bezier(.2, 1.5, .4, 1),
      height .45s cubic-bezier(.2, 1.5, .4, 1),
      font-size .45s cubic-bezier(.2, 1.5, .4, 1),
      transform .15s ease,
      box-shadow .15s ease,
      filter .2s ease;
  }
  @media (hover: hover) {
    .btn:hover {
      transform: translateY(-3px) rotate(-1deg);
      box-shadow: 0 9px 0 var(--ink);
      filter: brightness(1.08);
    }
  }
  .btn:active {
    transform: translateY(5px) scale(.96);
    box-shadow: 0 1px 0 var(--ink);
  }
  .btn:focus-visible {
    outline: 4px solid var(--yellow);
    outline-offset: 4px;
  }

  #yesBtn {
    background: var(--green);
    width: 64%;
    height: 62px;
    font-size: 1.6rem;
  }
  #noBtn {
    background: var(--red);
    width: 64%;
    height: 62px;
    font-size: 1.6rem;
  }

  /* Aşamalar: EVET küçülür, HAYIR büyür (en fazla kartın %100'ü) */
  [data-stage="1"] #yesBtn { width: 50%; height: 54px; font-size: 1.3rem; }
  [data-stage="1"] #noBtn  { width: 76%; height: 76px; font-size: 2.1rem; }

  [data-stage="2"] #yesBtn { width: 38%; height: 46px; font-size: 1.05rem; }
  [data-stage="2"] #noBtn  { width: 88%; height: 92px; font-size: 2.6rem; }

  [data-stage="3"] #noBtn  {
    width: 100%;
    height: 110px;
    font-size: clamp(2.4rem, 13vw, 3.4rem);
    animation: pulse 1s ease-in-out infinite;
  }
  @keyframes pulse {
    0%, 100% { scale: 1; }
    50%      { scale: .95; }
  }

  #yesBtn.vanish {
    pointer-events: none;
    animation: vanish .7s cubic-bezier(.6, -.4, .7, 1) forwards;
  }
  @keyframes vanish {
    30%  { transform: scale(1.25) rotate(-12deg); opacity: 1; }
    100% { transform: scale(0) rotate(720deg); opacity: 0; visibility: hidden; }
  }

  /* ---------- Final ekranı ---------- */
  .final-card { border-color: var(--yellow); position: relative; }

  .final-photo-wrap {
    animation: zoomIn 1.1s cubic-bezier(.2, 1.3, .4, 1) both;
  }
  @keyframes zoomIn {
    from { opacity: 0; transform: scale(.2) rotate(-12deg); }
    to   { opacity: 1; transform: none; }
  }
  .final-photo-wrap .photo {
    height: clamp(220px, 48vh, 460px);
    animation: glow 1.4s ease-in-out infinite alternate;
  }
  @keyframes glow {
    from { box-shadow: 0 0 0 4px var(--yellow), 0 0 14px var(--pink); }
    to   { box-shadow: 0 0 0 7px var(--pink), 0 0 34px var(--yellow); }
  }

  .reveal { opacity: 0; animation: reveal .7s cubic-bezier(.2, 1.6, .4, 1) forwards; }
  .d1 { animation-delay: .9s; }
  .d2 { animation-delay: 1.7s; }
  @keyframes reveal {
    from { opacity: 0; transform: translateY(30px) scale(.5); }
    to   { opacity: 1; transform: none; }
  }

  .win {
    font-size: clamp(1.7rem, 8.6vw, 3rem);
    font-weight: 900;
    color: var(--pink);
    text-shadow: 3px 3px 0 var(--ink);
    margin-top: 18px;
    line-height: 1.1;
  }
  .confession {
    margin-top: 14px;
    background: var(--ink);
    color: var(--yellow);
    border-radius: 18px;
    padding: 14px 10px;
    font-size: clamp(1.45rem, 7vw, 2.1rem);
    font-weight: 900;
    line-height: 1.25;
    text-wrap: balance;
  }
  .confession span { display: block; animation: wobble 1.6s ease-in-out infinite; }
  @keyframes wobble {
    0%, 100% { transform: rotate(-1.5deg); }
    50%      { transform: rotate(1.5deg) scale(1.03); }
  }

  /* ---------- Yatay telefon ve alçak ekranlar ---------- */
  @media (orientation: landscape) and (max-height: 560px) {
    .screen { max-width: 860px; }
    .card {
      display: grid;
      grid-template-columns: 1fr 1fr;
      column-gap: 18px;
      align-items: center;
    }
    #mainScreen .photo { height: 66vh; }
    .final-card .final-photo-wrap .photo { height: 78vh; }
    .win { margin-top: 0; font-size: clamp(1.7rem, 4.5vw, 2.6rem); }
    .text-area { min-height: 100px; padding: 4px 0; }
    .slot-yes { height: 68px; }
    .slot-no  { height: 114px; }
  }

  /* Küçük telefonlar: butonlar kaydırmadan görünsün */
  @media (orientation: portrait) and (max-height: 700px) {
    body { padding-top: 8px; }
    .card { padding: 12px; }
    #mainScreen .photo { height: 27vh; }
    .text-area { min-height: 100px; padding: 6px 0; }
    .slot-yes { height: 68px; }
    .slot-no  { height: 116px; }
  }

  @media (prefers-reduced-motion: reduce) {
    body, .floater, [data-stage="3"] #noBtn, .confession span,
    .final-photo-wrap .photo { animation: none; }
    .confetti-piece { display: none; }
  }
</style>
</head>
<body>

  <div class="fx" id="floaters" aria-hidden="true"></div>
  <div class="fx" id="confetti" aria-hidden="true"></div>

  <!-- ANA EKRAN -->
  <main class="screen" id="mainScreen" data-stage="0">
    <div class="card" id="mainCard">
      <div class="photo">
        <img id="mainPhoto" src="assets/ismet-ana.jpg" alt="İsmet">
        <div class="fallback"><span>🧐</span>assets/ismet-ana.jpg bulunamadı</div>
      </div>

      <div>
        <div class="text-area" aria-live="polite">
          <h1 id="question">İsmet terbiyeli bir çocuk mu?</h1>
        </div>

        <div class="slot slot-yes">
          <button type="button" class="btn" id="yesBtn">EVET</button>
        </div>
        <div class="slot slot-no">
          <button type="button" class="btn" id="noBtn">HAYIR</button>
        </div>
      </div>
    </div>
  </main>

  <!-- FİNAL EKRANI -->
  <section class="screen" id="finalScreen" hidden>
    <div class="card final-card">
      <div class="final-photo-wrap">
        <div class="photo">
          <img id="finalPhoto" src="assets/ismet-sonuc.jpg" alt="İsmet'in sonuç fotoğrafı">
          <div class="fallback"><span>😈</span>assets/ismet-sonuc.jpg bulunamadı</div>
        </div>
      </div>
      <div aria-live="assertive">
        <h2 class="win reveal d1">HAKLIYDIN! </h2>
        <p class="confession reveal d2"><span>İsmet'i terbiyesiz yapan binim😢</span></p>
      </div>
    </div>
  </section>

<script>
(function () {
  "use strict";

  const $ = (id) => document.getElementById(id);
  const mainScreen  = $("mainScreen");
  const finalScreen = $("finalScreen");
  const mainCard    = $("mainCard");
  const question    = $("question");
  const yesBtn      = $("yesBtn");
  const noBtn       = $("noBtn");

  const STAGES = [
    { question: "Emin misin? 🤨" },
    { question: "İyi düşün... Sonra pişman olma! 😂" },
    { question: "SON KARARIN MI? BİR DAHA DÜŞÜN!" }
  ];

  let yesCount = 0;
  let finished = false;

  /* ---------- SES SİSTEMİ ---------- */
  function createSound(src) {
    try {
      const audio = new Audio(src);
      audio.preload = "auto";
      return audio;
    } catch (e) {
      return null;
    }
  }

  const sounds = {
    yes:   createSound("assets/evet.ogg"),
    no:    createSound("assets/hayir.ogg"),
    final: createSound("assets/final.ogg")
  };

  let finalStarted = false;

  function stopSound(audio) {
    if (!audio) return;
    try {
      audio.pause();
      audio.currentTime = 0;
    } catch (e) { /* dosya henüz yüklenmemiş olabilir */ }
  }

  function playSound(name) {
    Object.keys(sounds).forEach((key) => stopSound(sounds[key]));
    const audio = sounds[name];
    if (!audio) return Promise.resolve(false);
    try {
      audio.muted = false;
      const result = audio.play();
      if (!result) return Promise.resolve(true);
      return result.then(() => true, () => false);
    } catch (e) {
      return Promise.resolve(false);
    }
  }

  /* Mobil tarayıcılar için: final sesini dokunma anında sessizce hazırlar. */
  function unlockFinalSound() {
    const audio = sounds.final;
    if (!audio) return;
    const reset = () => {
      if (finalStarted) return;
      stopSound(audio);
      audio.muted = false;
    };
    try {
      audio.muted = true;
      const result = audio.play();
      if (result) result.then(reset, () => {});
      else reset();
    } catch (e) { /* sessizce geç */ }
  }

  /* ---------- YARDIMCILAR ---------- */
  function restartAnimation(element, className) {
    element.classList.remove(className);
    void element.offsetWidth; // animasyonu baştan başlatır
    element.classList.add(className);
  }

  /* ---------- EVET ---------- */
  yesBtn.addEventListener("click", () => {
    if (finished || yesCount >= STAGES.length) return;

    yesCount += 1;
    playSound("yes");

    const stage = STAGES[yesCount - 1];
    question.textContent = stage.question;
    mainScreen.dataset.stage = String(yesCount);

    restartAnimation(question, "swap");
    restartAnimation(mainCard.querySelector(".text-area"), "shake");

    if (yesCount === STAGES.length) {
      yesBtn.disabled = true;
      yesBtn.classList.add("vanish");
      noBtn.focus({ preventScroll: true });
    }

    if (navigator.vibrate) navigator.vibrate(40 * yesCount);
  });

  /* ---------- HAYIR ---------- */
  noBtn.addEventListener("click", () => {
    if (finished) return;
    finished = true;
    yesBtn.disabled = true;

    unlockFinalSound();
    const noSound = sounds.no;
    const startedAt = Date.now();
    let opened = false;
    let timer = null;

    const open = () => {
      if (opened) return;
      opened = true;
      clearTimeout(timer);
      if (noSound) noSound.removeEventListener("ended", openSoon);
      showFinal();
    };
    // Geçiş animasyonu görünsün diye en az 450 ms beklenir.
    const openSoon = () => {
      clearTimeout(timer);
      timer = setTimeout(open, Math.max(0, 450 - (Date.now() - startedAt)));
    };

    mainCard.style.animation = "none";
    mainCard.style.transition = "transform .45s ease, opacity .45s ease";
    mainCard.style.transform = "scale(.9) rotate(3deg)";
    mainCard.style.opacity = ".6";

    // Final ekranı HAYIR sesi bitince, en geç 1,5 saniyede açılır.
    timer = setTimeout(open, 1500);
    if (noSound) noSound.addEventListener("ended", openSoon);
    playSound("no").then((ok) => { if (!ok) openSoon(); });
  });

  function showFinal() {
    mainScreen.hidden = true;
    finalScreen.hidden = false;
    document.body.classList.add("final-mode");
    window.scrollTo(0, 0);

    finalStarted = true;
    playSound("final");

    launchConfetti();
    setTimeout(launchConfetti, 1700);
  }

  /* ---------- EFEKTLER ---------- */
  function launchConfetti() {
    const box = $("confetti");
    const icons = ["🎉", "😂", "🎊", "✨", "🤣", "👑"];
    for (let i = 0; i < 45; i++) {
      const piece = document.createElement("span");
      piece.className = "confetti-piece";
      piece.textContent = icons[Math.floor(Math.random() * icons.length)];
      piece.style.left = Math.random() * 100 + "%";
      piece.style.fontSize = 16 + Math.random() * 22 + "px";
      piece.style.animationDuration = 2.2 + Math.random() * 2.5 + "s";
      piece.style.animationDelay = Math.random() * 1.2 + "s";
      piece.style.setProperty("--drift", (Math.random() * 160 - 80) + "px");
      piece.style.setProperty("--spin", (Math.random() * 720 - 360) + "deg");
      piece.addEventListener("animationend", () => piece.remove());
      box.appendChild(piece);
    }
  }

  function createFloaters() {
    const box = $("floaters");
    const icons = ["🤨", "😂", "🙃", "😇", "😈", "❓", "🤣"];
    for (let i = 0; i < 16; i++) {
      const item = document.createElement("span");
      item.className = "floater";
      item.textContent = icons[i % icons.length];
      item.style.left = Math.random() * 100 + "%";
      item.style.fontSize = 20 + Math.random() * 28 + "px";
      item.style.animationDuration = 9 + Math.random() * 12 + "s";
      item.style.animationDelay = -Math.random() * 20 + "s";
      box.appendChild(item);
    }
  }

  /* Fotoğraf yüklenemezse yer tutucu göster */
  [$("mainPhoto"), $("finalPhoto")].forEach((img) => {
    const markBroken = () => img.parentElement.classList.add("broken");
    img.addEventListener("error", markBroken);
    if (img.complete && img.naturalWidth === 0) markBroken();
  });

  /* Geri tuşuyla önbellekten dönülürse test baştan başlasın */
  window.addEventListener("pageshow", (event) => {
    if (event.persisted) window.location.reload();
  });

  createFloaters();
})();
</script>
</body>
</html>
